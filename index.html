<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Bibi 🩵 Nash &amp; Erika</title>
  <meta name="description" content="A tiny universe built by Bam for Bibi — happy birthday, superstar." />
  <meta name="theme-color" content="#071F3A" />
  <meta property="og:title" content="For Bibi 🩵 — a surprise from Nash" />
  <meta property="og:description" content="A tiny universe for Bibi &amp; Bam — happy birthday, superstar." />
  <meta property="og:type" content="website" />
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%237EC8E3" d="M12 21C7 16.9 2 12.6 2 8.5A4.6 4.6 0 0 1 6.6 3.9c1.9 0 3.6 1 4.9 2.7a.7.7 0 0 0 1 0c1.3-1.7 3-2.7 4.9-2.7A4.6 4.6 0 0 1 22 8.5c0 4.1-5 8.4-10 12.5Z"/></svg>' />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&amp;family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="is-locked">

  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-heart" viewBox="0 0 24 24">
      <path d="M12 21C7 16.9 2 12.6 2 8.5A4.6 4.6 0 0 1 6.6 3.9c1.9 0 3.6 1 4.9 2.7a.7.7 0 0 0 1 0c1.3-1.7 3-2.7 4.9-2.7A4.6 4.6 0 0 1 22 8.5c0 4.1-5 8.4-10 12.5Z"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24">
      <path d="m12 2 3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01L12 2z"/>
    </symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24">
      <path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"/>
    </symbol>
    <symbol id="i-wave" viewBox="0 0 24 24">
      <path d="M2 8c1.3 0 2 .9 3.4.9C7.6 8.9 7.6 7 10 7c2.5 0 2.3 1.9 4.6 1.9 1.4 0 2-.9 3.4-.9"/>
      <path d="M2 14c1.3 0 2 .9 3.4.9 2.2 0 2.2-1.9 4.6-1.9 2.5 0 2.3 1.9 4.6 1.9 1.4 0 2-.9 3.4-.9"/>
      <path d="M2 20c1.3 0 2 .9 3.4.9 2.2 0 2.2-1.9 4.6-1.9 2.5 0 2.3 1.9 4.6 1.9 1.4 0 2-.9 3.4-.9"/>
    </symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24">
      <path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3Z"/>
    </symbol>
    <symbol id="i-ball" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 3.2c.4 3 .1 5.8-1 8.3-1.2 2.6-3 4.7-6 6.1"/>
      <path d="M20.8 10.5c-2.6.6-4.9.4-7-.6"/>
      <path d="M9.4 3.6C7.2 5 5 7.9 4.3 11.3"/>
    </symbol>
    <symbol id="i-gift" viewBox="0 0 96 96">
      <g class="g-bow">
        <path d="M48 40c-7-9-17-7-14-1.5S44 40 48 38.5Z"/>
        <path d="M48 40c7-9 17-7 14-1.5S52 40 48 38.5Z"/>
      </g>
      <g class="g-lid">
        <rect x="22" y="44" width="52" height="13" rx="3"/>
        <rect x="41.5" y="44" width="13" height="13" rx="2"/>
      </g>
      <g class="g-body">
        <rect x="27" y="59" width="42" height="30" rx="3"/>
        <rect x="41.5" y="59" width="13" height="30" rx="2"/>
      </g>
    </symbol>
    <symbol id="i-cake" viewBox="0 0 24 24">
      <path d="M2 21h20"/>
      <path d="M4 21v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6"/>
      <path d="M12 9V5"/>
      <path d="M12 3.2c-.7.8-.7 1.6 0 2.3.7-.7.7-1.5 0-2.3Z"/>
    </symbol>
    <symbol id="i-chev" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
    <symbol id="i-envelope" viewBox="0 0 24 24">
      <rect x="2" y="4" width="20" height="16" rx="3"/>
      <path d="m2.5 7 9.5 6 9.5-6"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M20 6 9 17l-5-5"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
      <path d="M18 6 6 18M6 6l12 12"/>
    </symbol>
    <symbol id="i-replay" viewBox="0 0 24 24">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
    </symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24">
      <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
      <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
      <path d="M4 22h16"/>
      <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
      <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
      <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
    </symbol>
  </svg>

  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <div id="gift" class="gift" role="dialog" aria-modal="true" aria-label="A gift for Bibi">
    <div class="gift-stars" id="giftStars" aria-hidden="true"></div>
    <div class="gift-core">
      <p class="gift-kicker script" id="giftKicker"></p>
      <button id="giftBox" class="gift-box" type="button" aria-expanded="false" aria-label="Open your birthday gift">
        <span class="gift-glow" aria-hidden="true"></span>
        <svg class="gift-svg" aria-hidden="true"><use href="#i-gift"/></svg>
      </button>
      <p class="gift-hint" id="giftHint"></p>
      <p class="gift-tap" id="giftTap"></p>
    </div>
  </div>

  <main id="site" class="site" hidden>

    <header class="hero">
      <div class="hero-sky" aria-hidden="true">
        <span class="cloud cloud-1"></span>
        <span class="cloud cloud-2"></span>
        <span class="cloud cloud-3"></span>
        <div class="float-hearts" id="floatHearts"></div>
      </div>
      <div class="container hero-inner">
        <p class="hero-ribbon reveal">
          <svg class="ic"><use href="#i-cake"/></svg>
          <span id="heroRibbon"></span>
        </p>
        <h1 class="hero-title script reveal" id="heroTitle"></h1>
        <p class="hero-sub reveal" id="heroSub"></p>
        <div class="hero-names reveal">
          <span>Nash</span>
          <svg class="ic hero-heart"><use href="#i-heart"/></svg>
          <span>Erika</span>
        </div>
        <p class="hero-since" id="heroSince"></p>
        <ul class="hero-chips reveal" id="heroChips"></ul>
        <a class="btn btn-primary reveal" href="#counter" id="heroCta">
          <span id="heroCtaText"></span>
          <svg class="ic"><use href="#i-chev"/></svg>
        </a>
      </div>
      <div class="scroll-cue" aria-hidden="true"><svg class="ic"><use href="#i-chev"/></svg></div>
    </header>

    <section class="section counter-section" id="counter">
      <div class="container">
        <header class="section-head reveal">
          <h2 class="script" id="counterTitle"></h2>
          <p id="counterSub"></p>
        </header>
        <div class="counter-grid reveal">
          <div class="counter-card"><span class="counter-num" data-unit="0">0</span><span class="counter-label" data-label="0"></span></div>
          <div class="counter-card"><span class="counter-num" data-unit="1">0</span><span class="counter-label" data-label="1"></span></div>
          <div class="counter-card"><span class="counter-num" data-unit="2">0</span><span class="counter-label" data-label="2"></span></div>
          <div class="counter-card"><span class="counter-num" data-unit="3">0</span><span class="counter-label" data-label="3"></span></div>
        </div>
      </div>
    </section>

    <div class="whisper reveal"><span id="whisperSlot0"></span></div>

    <section class="section origin-section" id="origin">
      <div class="container">
        <header class="section-head reveal">
          <h2 class="script" id="originTitle"></h2>
          <p id="originSub"></p>
        </header>
        <div class="phone reveal">
          <div class="phone-bar" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="origin-row">
            <span class="origin-tag" id="originTag"></span>
            <p class="bubble bam origin-bubble" id="originQuote"></p>
          </div>
          <p class="origin-delivered" id="originDelivered"></p>
        </div>
        <p class="origin-note reveal" id="originNote"></p>
      </div>
    </section>

    <section class="moonlight" id="moonlight">
      <div class="moon" aria-hidden="true"></div>
      <div class="starfield" id="starfield" aria-hidden="true"></div>
      <div class="container moonlight-inner">
        <p class="chip chip-dark reveal"><svg class="ic"><use href="#i-moon"/></svg><span id="moonChip"></span></p>
        <h2 class="script moon-title reveal" id="moonTitle"></h2>
        <p class="moon-body reveal" id="moonBody"></p>
      </div>
    </section>

    <section class="section" id="timeline">
      <div class="container">
        <header class="section-head reveal">
          <h2 class="script" id="tlTitle"></h2>
          <p id="tlSub"></p>
        </header>
        <ol class="timeline" id="timelineList"></ol>
      </div>
    </section>

    <div class="whisper reveal"><span id="whisperSlot1"></span></div>

    <section class="section gallery-section" id="gallery">
      <div class="container">
        <header class="section-head reveal">
          <h2 class="script" id="galTitle"></h2>
          <p id="galSub"></p>
        </header>
        <div class="whisper whisper-inline reveal"><span id="whisperSlot2"></span></div>
        <div class="gallery-actions reveal">
          <button id="shuffleBtn" class="btn shuffle-btn" type="button">
            <svg class="ic"><use href="#i-sparkle"/></svg><span id="shuffleText"></span>
          </button>
        </div>
        <ul class="polaroid-grid" id="galleryGrid"></ul>
      </div>
    </section>

    <section class="section letter-section" id="letter">
      <div class="container">
        <figure class="letter reveal">
          <figcaption class="letter-head">
            <svg class="ic"><use href="#i-envelope"/></svg>
            <span>A letter for Bibi</span>
          </figcaption>
          <div class="letter-flow" id="letterFlow"></div>
          <p class="letter-ps" id="letterPs"></p>
          <p class="letter-sign script" id="letterSign"></p>
        </figure>
      </div>
    </section>

    <section class="section chat-section" id="chat">
      <div class="container">
        <header class="section-head reveal">
          <h2 class="script" id="chatTitle"></h2>
          <p id="chatSub"></p>
        </header>
        <ul class="chat-thread" id="chatThread"></ul>
      </div>
    </section>

    <section class="section reasons-section" id="reasons">
      <div class="container">
        <header class="section-head reveal">
          <h2 class="script" id="reasonTitle"></h2>
          <p id="reasonSub"></p>
        </header>
        <ul class="reason-grid" id="reasonGrid"></ul>
        <p class="reason-final script" id="reasonFinal" hidden></p>
      </div>
    </section>

    <div class="whisper reveal"><span id="whisperSlot3"></span></div>

    <section class="section quiz-section" id="quiz">
      <div class="container">
        <header class="section-head reveal">
          <h2 class="script" id="qTitle"></h2>
          <p id="qSub"></p>
        </header>
        <div class="quiz-panel reveal" id="quizPanel">
          <div class="quiz-top">
            <div class="quiz-progress"><i id="quizBar"></i></div>
            <span class="quiz-count" id="quizCount"></span>
          </div>
          <h3 class="quiz-q" id="quizQ"></h3>
          <ul class="quiz-opts" id="quizOpts"></ul>
        </div>
        <div class="quiz-result" id="quizResult" hidden>
          <svg class="ic quiz-trophy"><use href="#i-trophy"/></svg>
          <p class="quiz-score"><span id="quizScoreNum"></span><span class="quiz-score-total"></span></p>
          <p class="quiz-msg script" id="quizMsg"></p>
          <button class="btn btn-ghost" id="quizReplay" type="button">
            <svg class="ic"><use href="#i-replay"/></svg><span id="quizReplayText"></span>
          </button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <svg class="ic footer-heart"><use href="#i-heart"/></svg>
      <p class="script footer-line" id="footerLine"></p>
      <p class="footer-by" id="footerBy"></p>
      <button class="btn btn-ghost" id="againBtn" type="button">
        <svg class="ic"><use href="#i-sparkle"/></svg><span id="againText"></span>
      </button>
    </footer>

  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
